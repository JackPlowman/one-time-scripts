name: Clean Caches

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-caches:
    name: Clean Caches
    permissions:
      actions: write # to delete repository caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches
        run: gh cache delete --all --succeed-on-no-cache --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
